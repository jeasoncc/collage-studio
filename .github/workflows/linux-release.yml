name: Linux release

on:
  workflow_dispatch:
    inputs:
      publish_snap:
        description: Publish the built Snap to stable (registered Store name and credentials required)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: linux-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - name: Require the versioned source tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/tags/v1.0.0 ]]; then
            echo 'Run this workflow on the v1.0.0 tag, not a branch.' >&2
            exit 1
          fi
          bun --eval "import {readFileSync} from 'node:fs'; import {z} from 'zod'; z.object({version:z.literal('1.0.0')}).parse(JSON.parse(readFileSync('package.json','utf8')));"
          mkdir -p out
          git archive --format=tar.gz --prefix=collage-studio-1.0.0/ HEAD > out/collage-studio-1.0.0.tar.gz
          (cd out && sha256sum collage-studio-1.0.0.tar.gz > collage-studio-1.0.0.tar.gz.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: source-release
          path: |
            out/collage-studio-1.0.0.tar.gz
            out/collage-studio-1.0.0.tar.gz.sha256
          if-no-files-found: error

  snap:
    needs: source
    runs-on: ubuntu-24.04
    environment: snap-store
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: source-release
          path: source-archive
      # The owner must first register the exact name. Export expiring credentials
      # restricted to collage-studio, stable, and package_push/package_release:
      # snapcraft export-login --snaps=collage-studio --channels=stable \
      #   --acls=package_push,package_release --expires=<ISO-8601> <private-file>
      # Store the file content only in this protected Environment's secret.
      - name: Require genuine Store credentials
        if: inputs.publish_snap
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          if [[ -z "$SNAPCRAFT_STORE_CREDENTIALS" ]]; then
            echo 'Register collage-studio with the Snap Store and configure expiring, name/channel/ACL-restricted SNAPCRAFT_STORE_CREDENTIALS in the protected snap-store GitHub Environment.' >&2
            exit 1
          fi
      - name: Unpack and retain the exact complete source release
        run: |
          (cd source-archive && sha256sum -c collage-studio-1.0.0.tar.gz.sha256)
          tar -xzf source-archive/collage-studio-1.0.0.tar.gz
          mkdir -p collage-studio-1.0.0/snap/local
          cp source-archive/collage-studio-1.0.0.tar.gz collage-studio-1.0.0/snap/local/
      - name: Build the strict Snap without Store credentials
        uses: snapcore/action-build@v1
        id: snapcraft
        with:
          path: collage-studio-1.0.0
          snapcraft-args: --build-for=amd64
      - name: Extract the corresponding source from the actual Snap
        env:
          SNAP_PATH: ${{ steps.snapcraft.outputs.snap }}
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools
          unsquashfs -d snap-content "$SNAP_PATH" usr/share/licenses/collage-studio meta/snap.yaml
          test "$(awk '/^confinement:/ {print $2}' snap-content/meta/snap.yaml)" = strict
          test "$(awk '/^base:/ {print $2}' snap-content/meta/snap.yaml)" = core24
          mkdir -p out
          cp snap-content/usr/share/licenses/collage-studio/*.tar.gz* out/
          (cd out && sha256sum -c collage-studio-1.0.0.tar.gz.sha256 && sha256sum -c collage-studio-codec-corresponding-source.tar.gz.sha256)
          cmp source-archive/collage-studio-1.0.0.tar.gz out/collage-studio-1.0.0.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: linux-source-materials
          path: out/*.tar.gz*
          if-no-files-found: error
      - name: Require strict host confinement and install the real package
        env:
          SNAP_PATH: ${{ steps.snapcraft.outputs.snap }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-user-session xdotool imagemagick xdg-desktop-portal-gtk
          # This is an ephemeral GitHub VM, not the developer's desktop.
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          test "$(snap debug confinement)" = strict
          sudo snap install --dangerous "$SNAP_PATH"
          snap connections collage-studio
      - name: Launch the sandboxed GNOME desktop application
        # Xvfb has no DRI3/DMA-BUF display. This is test-only rendering setup,
        # not a shipped environment override or a relaxation of confinement.
        env:
          GDK_BACKEND: x11
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: bash snap/smoke-test.sh evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snap-runtime-evidence
          path: evidence
          if-no-files-found: warn

      - name: Install Snapcraft
        if: inputs.publish_snap
        run: sudo snap install snapcraft --classic
      - name: Upload and release the actual package to stable
        if: inputs.publish_snap
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          SNAP_PATH: ${{ steps.snapcraft.outputs.snap }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "$SNAP_PATH"
          snapcraft upload "$SNAP_PATH" --release=stable

  release:
    needs: [source, snap]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: source-release
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: linux-source-materials
          path: out
      - name: Publish complete source and corresponding source only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view v1.0.0 >/dev/null 2>&1; then
            gh release create v1.0.0 --verify-tag --title '拼贴时光 1.0.0' --generate-notes
          fi
          gh release upload v1.0.0 out/*.tar.gz out/*.sha256 --clobber
      - name: Generate checksum-backed AUR materials from the public source asset
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: node scripts/generate-aur.mjs "$RELEASE_REPOSITORY" out/aur/collage-studio
      - name: Publish AUR materials and artifact checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tar -C out/aur -czf out/collage-studio-1.0.0-aur.tar.gz collage-studio
          (cd out && sha256sum *.tar.gz > SHA256SUMS)
          gh release upload v1.0.0 out/collage-studio-1.0.0-aur.tar.gz out/SHA256SUMS --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: aur-materials
          path: out/aur/collage-studio
          include-hidden-files: true
          if-no-files-found: error

