name: Linux release

on:
  push:
    tags: ['v1.0.0']
  workflow_dispatch:
    inputs:
      publish_snap:
        description: Publish the built Snap to stable (registered Store name and credentials required)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: linux-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Require the versioned source tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/tags/v1.0.0 ]]; then
            echo 'Run this workflow on the v1.0.0 tag, not a branch.' >&2
            exit 1
          fi
          node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('package.json')); if(p.version !== '1.0.0') throw new Error('Package and tag versions differ')"
          mkdir -p out
          git archive --format=tar.gz --prefix=collage-studio-1.0.0/ HEAD > out/collage-studio-1.0.0.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: source-release
          path: out/collage-studio-1.0.0.tar.gz
          if-no-files-found: error

  linux:
    needs: source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: source-release
          path: source-archive
      - name: Unpack the local source release
        run: tar -xzf source-archive/collage-studio-1.0.0.tar.gz
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.94.1'
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config curl unzip libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf cmake autoconf automake libtool python3 xz-utils patch
      - name: Build the embedded desktop application
        working-directory: collage-studio-1.0.0
        run: |
          bun install --frozen-lockfile
          bun run native:build --no-bundle -- --locked
          bun scripts/license-codecs.mjs release ../out
      - uses: actions/upload-artifact@v4
        with:
          name: linux-source-materials
          path: |
            out/*.tar.gz
            out/*.sha256
          if-no-files-found: error

  snap:
    needs: source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: source-release
          path: source-archive
      - name: Unpack the local source release
        run: tar -xzf source-archive/collage-studio-1.0.0.tar.gz
      - name: Build the strict Snap without Store credentials
        uses: snapcore/action-build@v1
        id: snapcraft
        with:
          path: collage-studio-1.0.0
      - uses: actions/upload-artifact@v4
        with:
          name: snap-package
          path: ${{ steps.snapcraft.outputs.snap }}
          if-no-files-found: error

  release:
    needs: [source, linux, snap]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: source-release
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: linux-source-materials
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: snap-package
          path: out
      - name: Publish complete source, corresponding source, and the Snap
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view v1.0.0 >/dev/null 2>&1; then
            gh release create v1.0.0 --verify-tag --title '拼贴时光 1.0.0' --generate-notes
          fi
          gh release upload v1.0.0 out/*.tar.gz out/*.sha256 out/*.snap --clobber
      - name: Generate checksum-backed AUR materials from the public source asset
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: node scripts/generate-aur.mjs "$RELEASE_REPOSITORY" out/aur/collage-studio
      - name: Publish AUR materials and artifact checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tar -C out/aur -czf out/collage-studio-1.0.0-aur.tar.gz collage-studio
          (cd out && sha256sum *.tar.gz *.snap > SHA256SUMS)
          gh release upload v1.0.0 out/collage-studio-1.0.0-aur.tar.gz out/SHA256SUMS --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: aur-materials
          path: out/aur/collage-studio
          include-hidden-files: true
          if-no-files-found: error

  snap-store:
    needs: [snap, release]
    if: github.event_name == 'workflow_dispatch' && inputs.publish_snap
    runs-on: ubuntu-24.04
    environment: snap-store
    steps:
      - name: Require genuine Store credentials
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          if [[ -z "$SNAPCRAFT_STORE_CREDENTIALS" ]]; then
            echo 'Register collage-studio with the Snap Store and configure restricted SNAPCRAFT_STORE_CREDENTIALS in the snap-store GitHub Environment.' >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: snap-package
          path: out
      - name: Install Snapcraft
        run: sudo snap install snapcraft --classic
      - name: Upload and release the actual package to stable
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: snapcraft upload out/*.snap --release=stable
