appId: top.szlh.collage
---
- scrollUntilVisible:
    element:
      text: "保存可编辑项目"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: "保存可编辑项目"
- extendedWaitUntil:
    visible: "Cancel"
    timeout: 60000
- takeScreenshot: "08-native-project-file-picker"
- runFlow:
    when:
      visible: "On My iPhone"
    commands:
      - tapOn: "On My iPhone"
- tapOn:
    text: "Save"
    enabled: true
- extendedWaitUntil:
    visible: "可编辑项目已保存，可在其他设备导入继续编辑。"
    timeout: 10000
- takeScreenshot: "09-native-editable-project-saved"
