appId: top.szlh.collage
---
# Scroll the dialog body, not the whole device viewport or its fixed footer.
- swipe:
    from:
      text: "清晰度"
    direction: UP
    duration: 400
- takeScreenshot: "07b-project-button-visible-in-export-dialog"
- tapOn: "保存可编辑项目"
- extendedWaitUntil:
    visible: "Cancel"
    timeout: 60000
- takeScreenshot: "08-native-project-file-picker"
- runFlow:
    when:
      visible: "On My iPhone"
    commands:
      - tapOn: "On My iPhone"
# iOS 26.2 omits the remembered-folder Save button from XCTest accessibility.
# Tap the actual top-right blue Save control captured in the preceding screenshot.
- tapOn:
    point: "88%,12%"
- extendedWaitUntil:
    visible: "可编辑项目已保存，可在其他设备导入继续编辑。"
    timeout: 10000
- takeScreenshot: "09-native-editable-project-saved"
